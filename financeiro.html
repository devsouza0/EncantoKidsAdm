<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financeiro - Encanto Kids</title>

<link rel="stylesheet" href="css/dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<style>

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:15px;
    border:1px solid #374151;
}

.card h3{
    color:#9ca3af;
    margin-bottom:10px;
}

.card h2{
    color:#ff7b00;
}

.formulario{

    margin-top:30px;
    background:#111827;
    padding:25px;
    border-radius:15px;
    border:1px solid #374151;

}

.formulario input,
.formulario select{

    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;

    background:#1f2937;
    color:white;

    border:none;
    border-radius:10px;

}

.btn{

    width:100%;
    padding:14px;

    background:#ff7b00;

    color:white;

    border:none;
    border-radius:10px;

    font-weight:bold;
    cursor:pointer;

}

table{

    width:100%;
    border-collapse:collapse;

}

th,td{

    padding:12px;
    border-bottom:1px solid #374151;

}

th{

    color:#ff7b00;

}

.btn-excluir{

    background:#dc2626;

    color:white;

    border:none;

    padding:8px 12px;

    border-radius:8px;

    cursor:pointer;

}

.btn-voltar{

    display:inline-block;

    margin-bottom:20px;

    color:white;

    text-decoration:none;

    font-weight:bold;

}

</style>

</head>

<body>

<div class="content">

<a href="dashboard.html" class="btn-voltar">

← Voltar

</a>

<h1>Financeiro</h1>
<section class="cards">

    <div class="card">
        <h3>Entradas</h3>
        <h2 id="totalEntradas">R$ 0,00</h2>
    </div>

    <div class="card">
        <h3>Saídas</h3>
        <h2 id="totalSaidas">R$ 0,00</h2>
    </div>

    <div class="card">
        <h3>Lucro</h3>
        <h2 id="lucroTotal">R$ 0,00</h2>
    </div>

</section>

<div class="table-box">

    <table>

        <thead>
            <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaFinanceiro">

        </tbody>

    </table>

</div>

<div class="formulario">

    <h2>Novo Lançamento</h2>

    <label>Descrição</label>
    <input type="text" id="descricao">

    <label>Tipo</label>
    <select id="tipo">
        <option value="Entrada">Entrada</option>
        <option value="Saida">Saída</option>
    </select>

    <label>Valor</label>
    <input type="number" id="valor" step="0.01">

    <label>Data</label>
    <input type="date" id="data">

    <button class="btn" onclick="salvarLancamento()">
        Salvar Lançamento
    </button>

</div>
<script>

async function carregarFinanceiro(){

    const { data, error } = await supabaseClient
        .from("financeiro")
        .select("*")
        .order("id",{ascending:false});

    if(error){
        console.log(error);
        return;
    }

    let entradas = 0;
    let saidas = 0;

    const tabela = document.getElementById("listaFinanceiro");

    tabela.innerHTML = "";

    data.forEach(item=>{

        if(item.tipo==="Entrada"){
            entradas += Number(item.valor);
        }else{
            saidas += Number(item.valor);
        }

        tabela.innerHTML += `
        <tr>

            <td>${item.data}</td>

            <td>${item.descricao}</td>

            <td>${item.tipo}</td>

            <td>
                R$ ${Number(item.valor).toFixed(2)}
            </td>

            <td>

                <button
                    class="btn-excluir"
                    onclick="excluirLancamento(${item.id})">

                    Excluir

                </button>

            </td>

        </tr>
        `;

    });

    document.getElementById("totalEntradas").innerText =
    entradas.toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL"
    });

    document.getElementById("totalSaidas").innerText =
    saidas.toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL"
    });

    document.getElementById("lucroTotal").innerText =
    (entradas-saidas).toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL"
    });

}

async function salvarLancamento(){

    const descricao =
    document.getElementById("descricao").value;

    const tipo =
    document.getElementById("tipo").value;

    const valor =
    document.getElementById("valor").value;

    const data =
    document.getElementById("data").value;

    if(descricao==""){

        alert("Digite uma descrição.");

        return;

    }

    const { error } = await supabaseClient
    .from("financeiro")
    .insert([{

        descricao,
        tipo,
        valor,
        data

    }]);

    if(error){

        alert(error.message);

        return;

    }

    document.getElementById("descricao").value="";
    document.getElementById("valor").value="";
    document.getElementById("data").value="";

    carregarFinanceiro();

}

async function excluirLancamento(id){

    if(!confirm("Deseja excluir este lançamento?"))
        return;

    await supabaseClient
    .from("financeiro")
    .delete()
    .eq("id",id);

    carregarFinanceiro();

}

carregarFinanceiro();

</script>

</body>
</html>
