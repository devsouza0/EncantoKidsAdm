<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Reserva - Encanto Kids</title>

<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="content">

    <h1>Nova Reserva</h1>

    <form class="formulario">

        <label>Nome do Cliente</label>
        <input type="text" placeholder="Digite o nome">

        <label>Telefone</label>
        <input type="text" placeholder="(00) 00000-0000">

        <label>Data do Evento</label>
        <input type="date">

        <label>Cidade</label>
        <input type="text">

        <label>Endereço</label>
        <input type="text">

        <label>Brinquedo</label>
        <select>
            <option>Pula-Pula</option>
            <option>Tobogã</option>
            <option>Castelo Inflável</option>
        </select>

        <label>Valor</label>
        <input type="number" placeholder="149.99">

        <button type="submit">Salvar Reserva</button>

    </form>

</div>

</body>
</html>
