<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Encanto Kids ADM</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#1e3a8a 0%,transparent 40%),
    radial-gradient(circle at bottom right,#2563eb 0%,transparent 35%),
    #0b0b0f;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    background:rgba(37,99,235,.15);
    border-radius:50%;
    filter:blur(120px);
    animation:float 8s ease-in-out infinite;
}

body::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(59,130,246,.12);
    border-radius:50%;
    filter:blur(120px);
    animation:float2 10s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translate(-100px,-50px);}
    50%{transform:translate(50px,50px);}
    100%{transform:translate(-100px,-50px);}
}

@keyframes float2{
    0%{transform:translate(100px,50px);}
    50%{transform:translate(-50px,-50px);}
    100%{transform:translate(100px,50px);}
}

.login-box{
    position:relative;
    z-index:10;
    width:400px;
    padding:40px;
    background:rgba(17,24,39,.75);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    box-shadow:
    0 10px 40px rgba(0,0,0,.5),
    0 0 30px rgba(37,99,235,.15);
}

.logo{
    text-align:center;
    margin-bottom:35px;
}

.logo i{
    font-size:60px;
    color:#3b82f6;
    margin-bottom:15px;
}

.logo h1{
    color:white;
    font-size:28px;
    margin-bottom:5px;
}

.logo p{
    color:#94a3b8;
    font-size:14px;
}

.input-group{
    position:relative;
    margin-bottom:18px;
}

.input-group i{
    position:absolute;
    left:15px;
    top:16px;
    color:#64748b;
}

.input-group input{
    width:100%;
    padding:14px 14px 14px 45px;
    border:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    outline:none;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    border:1px solid #2563eb;
    box-shadow:0 0 15px rgba(37,99,235,.25);
}

.btn-login{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn-login:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(37,99,235,.45);
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#64748b;
    font-size:13px;
}

.erro{
    margin-top:15px;
    text-align:center;
    color:#ef4444;
    display:none;
}

@media(max-width:480px){

.login-box{
    width:92%;
    padding:30px;
}

}

</style>
</head>
<body>

<div class="login-box">

    <div class="logo">

        <i class="fa-solid fa-balloon"></i>

        <h1>Encanto Kids 💻</h1>

        <p>Painel Administrativo</p>

    </div>

    <div class="input-group">

        <i class="fas fa-user"></i>

        <input
        type="text"
        id="usuario"
        placeholder="Usuário">

    </div>

    <div class="input-group">

        <i class="fas fa-lock"></i>

        <input
        type="password"
        id="senha"
        placeholder="Senha">

    </div>

    <button class="btn-login" onclick="login()">

        Acessar Painel

    </button>

    <div id="erro" class="erro">

        Usuário ou senha inválidos

    </div>

    <div class="footer">

        © 2026 Encanto Kids Infláveis

    </div>

</div>

<script>

function login(){

    const usuario =
    document.getElementById("usuario").value;

    const senha =
    document.getElementById("senha").value;

    const erro =
    document.getElementById("erro");

    // ALTERE AQUI

const usuarios = [

    {
        usuario:"vinysouza",
        senha:"kjkszpj3"
    },

    {
        usuario:"betosouza",
        senha:"beto123"
    },

    {
        usuario:"dayanasouza",
        senha:"dayana123"
    }

];

const loginValido = usuarios.find(
    u =>
    u.usuario === usuario &&
    u.senha === senha
);

if(loginValido){

        localStorage.setItem("logado", "sim");
localStorage.setItem("usuario", usuario);

window.location.href = "dashboard.html";

    }else{

        erro.style.display = "block";

    }

}

document.addEventListener("keypress",function(e){

    if(e.key === "Enter"){

        login();

    }

});

</script>

</body>
</html>
