<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes - Encanto Kids</title>

<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>

.topo-clientes{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.topo-clientes input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
}

.formulario{
    margin-top:30px;
    background:#111827;
    padding:25px;
    border-radius:15px;
    border:1px solid #374151;
}

.formulario h2{
    margin-bottom:20px;
}

.formulario label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

.formulario input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
}

.btn-salvar{
    width:100%;
    margin-top:20px;
    background:#ff7b00;
    color:white;
    border:none;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

.btn-voltar{
    display:inline-block;
    margin-bottom:20px;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    color:#ff7b00;
}

th,td{
    padding:12px;
    text-align:left;
    border-bottom:1px solid #374151;
}

</style>

</head>
<body>

<div class="content">

    <a href="dashboard.html" class="btn-voltar">
        ← Voltar
    </a>

    <h1>Clientes</h1>

    <div class="topo-clientes">
        <input type="text" placeholder="Pesquisar cliente...">
    </div>

    <div class="tabela">

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Cidade</th>
                    <th>Endereço</th>
                </tr>
            </thead>

            <tbody id="listaClientes">
            </tbody>

        </table>

    </div>

    <div class="formulario">

        <h2>Cadastrar Cliente</h2>

        <label>Nome Completo</label>
        <input type="text" id="nome">

        <label>Telefone</label>
        <input type="text" id="telefone">

        <label>Cidade</label>
        <input type="text" id="cidade">

        <label>Endereço</label>
        <input type="text" id="endereco">

        <button type="button"
        class="btn-salvar"
        onclick="salvarCliente()">
            Salvar Cliente
        </button>

    </div>

</div>

<script>

const supabaseUrl = "https://stnjpquafragqjwxyjza.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0bmpwcXVhZnJhZ3Fqd3h5anphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzI2MzAsImV4cCI6MjEwMDUwODYzMH0.r3YlozqWb2h96TLomC-VOfeQNLknio8x5xaiNVlQOkE";

const supabaseClient = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function carregarClientes(){

    const { data, error } = await supabaseClient
        .from("clientes")
        .select("*")
        .order("id", { ascending:false });

    if(error){
        console.log(error);
        return;
    }

    const tabela = document.getElementById("listaClientes");

    tabela.innerHTML = "";

    data.forEach(cliente => {

        tabela.innerHTML += `
            <tr>
                <td>${cliente.nome || ""}</td>
                <td>${cliente.telefone || ""}</td>
                <td>${cliente.cidade || ""}</td>
                <td>${cliente.endereco || ""}</td>
            </tr>
        `;

    });

}

async function salvarCliente(){

    const nome = document.getElementById("nome").value;
    const telefone = document.getElementById("telefone").value;
    const cidade = document.getElementById("cidade").value;
    const endereco = document.getElementById("endereco").value;

    if(nome === ""){
        alert("Digite o nome do cliente.");
        return;
    }

    const { error } = await supabaseClient
        .from("clientes")
        .insert([
            {
                nome:nome,
                telefone:telefone,
                cidade:cidade,
                endereco:endereco
            }
        ]);

 if(error){
    console.log(error);
    alert(error.message);
    return;
}

    alert("Cliente cadastrado com sucesso!");

    document.getElementById("nome").value = "";
    document.getElementById("telefone").value = "";
    document.getElementById("cidade").value = "";
    document.getElementById("endereco").value = "";

    carregarClientes();

}

carregarClientes();

</script>

</body>
</html>
