<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes - Encanto Kids</title>

<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="content">

    <h1>Clientes</h1>

    <div class="topo-clientes">

        <input type="text" placeholder="Pesquisar cliente...">

        <button>+ Novo Cliente</button>

    </div>

    <div class="tabela">

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Cidade</th>
                    <th>Endereço</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>João Silva</td>
                    <td>(16) 99999-9999</td>
                    <td>Casa Branca</td>
                    <td>Rua Exemplo, 123</td>
                </tr>

                <tr>
                    <td>Maria Souza</td>
                    <td>(16) 98888-8888</td>
                    <td>Casa Branca</td>
                    <td>Av. Central, 500</td>
                </tr>

            </tbody>

        </table>

    </div>

    <div class="formulario">

        <h2>Cadastrar Cliente</h2>

        <label>Nome Completo</label>
        <input type="text">

        <label>Telefone</label>
        <input type="text">

        <label>Cidade</label>
        <input type="text">

        <label>Endereço</label>
        <input type="text">

        <label>Observações</label>
        <textarea></textarea>

        <button>Salvar Cliente</button>

    </div>

</div>

</body>
</html>
