<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Encanto Kids ADM</title>

<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
    <style>
.btn-sair{
    background:#dc2626;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.btn-sair:hover{
    background:#b91c1c;
    transform:translateY(-2px);
}
</style>


</head>
<body>
<button id="menuMobile" class="menu-mobile">
    ☰
</button>

<div class="sidebar">

    <div class="logo">
        <i class="fa-solid fa-balloon"></i>
        <div>
            <h2>Encanto Kids</h2>
            <p>Painel Administrativo</p>
        </div>
    </div>

    <div class="menu">

        <a href="dashboard.html" class="active">
            <i class="fas fa-house"></i>
            <span>Dashboard</span>
        </a>

        <a href="reservas.html">
            <i class="fas fa-calendar-days"></i>
            <span>Reservas</span>
        </a>

        <a href="clientes.html">
            <i class="fas fa-users"></i>
            <span>Clientes</span>
        </a>

        <a href="brinquedos.html">
            <i class="fas fa-futbol"></i>
            <span>Brinquedos</span>
        </a>
        
        <a href="calendario.html">
            <i class="fas fa-calendar"></i>
            <span>Calendário</span>
        </a>

        <a href="financeiro.html" id="menuFinanceiro">
            <i class="fas fa-money-bill-wave"></i>
            <span>Financeiro</span>
        </a>

        <a href="#" id="menuRelatorios">
            <i class="fas fa-chart-line"></i>
            <span>Relatórios</span>
        </a>

        <a href="#" id="menuConfiguracoes">
            <i class="fas fa-gear"></i>
            <span>Configurações</span>
        </a>

    </div>

</div>

<div class="content">

    <header>

        <div>
            <h1>Dashboard</h1>
            <p>Bem-vindo ao sistema Encanto Kids</p>
        </div>

<div class="user" style="display:flex;align-items:center;gap:10px;">

    <i class="fas fa-user-circle"></i>

    <span id="usuarioLogado"></span>

    <button onclick="logout()" class="btn-sair">
        <i class="fas fa-right-from-bracket"></i>
        Sair
    </button>

</div>

    </header>

    <section class="cards">

        <div class="card">
            <h3>Reservas</h3>
            <h2 id="totalReservas">0</h2>
        </div>

        <div class="card">
            <h3>Clientes</h3>
            <h2 id="totalClientes">0</h2>
        </div>

        <div class="card">
            <h3>Brinquedos</h3>
            <h2>3</h2>
        </div>

        <div class="card">
            <h3>Faturamento</h3>
            <h2 id="faturamento">R$ 0,00</h2>
        </div>

    </section>

    <section class="table-box">

        <h2>Últimas Reservas</h2>

        <table>

            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Brinquedo</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="ultimasReservas">

            </tbody>

        </table>

    </section>

</div>

<script> if(localStorage.getItem("logado") !== "sim"){

    window.location.href = "index.html";

}


async function carregarDashboard(){

    // CLIENTES
    const { count: totalClientes } = await supabaseClient
        .from("clientes")
        .select("*",{count:"exact",head:true});

    document.getElementById("totalClientes").innerText =
        totalClientes || 0;

    // RESERVAS
    const { count: totalReservas } = await supabaseClient
        .from("reservas")
        .select("*",{count:"exact",head:true});

    document.getElementById("totalReservas").innerText =
        totalReservas || 0;

    // FATURAMENTO
    const { data: reservas } = await supabaseClient
        .from("reservas")
        .select("valor");

    let total = 0;

    reservas?.forEach(item => {
        total += Number(item.valor || 0);
    });

    document.getElementById("faturamento").innerText =
        total.toLocaleString("pt-BR",{
            style:"currency",
            currency:"BRL"
        });

    // ÚLTIMAS RESERVAS
    const { data: ultimas } = await supabaseClient
        .from("reservas")
        .select("*")
        .order("id",{ascending:false})
        .limit(5);

    const tabela =
        document.getElementById("ultimasReservas");

    tabela.innerHTML = "";

    ultimas?.forEach(reserva => {

        let classe =
            reserva.status === "Confirmado"
            ? "status-ok"
            : "status-pendente";

        tabela.innerHTML += `
        <tr>
            <td>${reserva.cliente}</td>
            <td>${reserva.brinquedo}</td>
            <td>
                <span class="${classe}">
                    ${reserva.status}
                </span>
            </td>
        </tr>
        `;
    });

}

carregarDashboard();

const usuario =
localStorage.getItem("usuario");

const cargo =
localStorage.getItem("cargo");

document.getElementById("usuarioLogado").innerText =
usuario + " (" + cargo + ")";

function logout(){

    localStorage.removeItem("logado");
    localStorage.removeItem("usuario");
    localStorage.removeItem("cargo");

    window.location.href = "index.html";

}

if(cargo !== "Ceo"){

    const financeiro =
    document.getElementById("menuFinanceiro");

    const relatorios =
    document.getElementById("menuRelatorios");

    const configuracoes =
    document.getElementById("menuConfiguracoes");

    if(financeiro) financeiro.style.display = "none";
    if(relatorios) relatorios.style.display = "none";
    if(configuracoes) configuracoes.style.display = "none";

}

</script> 

    <script>
const menuBtn = document.getElementById("menuMobile");
const sidebar = document.querySelector(".sidebar");

if(menuBtn && sidebar){
    menuBtn.addEventListener("click", () => {
        sidebar.classList.toggle("abrir");
}
});
</script>
</body>
</html>
