<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reservas - Encanto Kids</title>

<link rel="stylesheet" href="css/dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<style>

.btn-voltar{
    display:inline-block;
    margin-bottom:20px;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.topo-reservas{
    margin-bottom:20px;
}

.topo-reservas input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
}

.tabela{
    background:#111827;
    border:1px solid #374151;
    border-radius:15px;
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    color:#ff7b00;
}

th,td{
    padding:12px;
    border-bottom:1px solid #374151;
    text-align:left;
}

.formulario{
    margin-top:30px;
    background:#111827;
    border:1px solid #374151;
    border-radius:15px;
    padding:25px;
}

.formulario h2{
    margin-bottom:20px;
}

.formulario label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

.formulario input,
.formulario select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
}

.btn-salvar{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#ff7b00;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.btn-contrato{
    background:#ff7b00;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="content">

<a href="dashboard.html" class="btn-voltar">
← Voltar
</a>

<h1>Reservas</h1>

<div class="topo-reservas">
<input type="text" placeholder="Pesquisar reserva...">
</div>

<div class="tabela">

<table>

<thead>
<tr>
<th>Cliente</th>
<th>Brinquedo</th>
<th>Data</th>
<th>Valor</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="listaReservas">

</tbody>

</table>

</div>

<div class="formulario">

<h2>Nova Reserva</h2>

<label>Cliente</label>
<input type="text" id="cliente">

<label>Brinquedo</label>
<input type="text" id="brinquedo">

<label>Data do Evento</label>
<input type="date" id="data_evento">

<label>Valor</label>
<input type="number" id="valor">

<label>Status</label>
<select id="status">
<option>Pendente</option>
<option>Confirmado</option>
<option>Finalizado</option>
</select>

<button class="btn-salvar" onclick="salvarReserva()">
Salvar Reserva
</button>

</div>

</div>

<script>


async function carregarReservas(){

    const { data, error } = await supabaseClient
        .from("reservas")
        .select("*")
        .order("id", { ascending:false });

    if(error){
        console.log(error);
        return;
    }

    const tabela = document.getElementById("listaReservas");

    tabela.innerHTML = "";

    data.forEach(reserva => {

        tabela.innerHTML += `
        <tr>
            <td>${reserva.cliente || ""}</td>
            <td>${reserva.brinquedo || ""}</td>
            <td>${reserva.data_evento || ""}</td>
            <td>R$ ${reserva.valor || "0,00"}</td>
            <td>${reserva.status || ""}</td>

            <td>
                <button
                    class="btn-contrato"
                    onclick="abrirContrato(
                        '${reserva.cliente}',
                        '${reserva.brinquedo}',
                        '${reserva.data_evento}',
                        '${reserva.valor}'
                    )">
                    📄 Contrato
                </button>
            </td>
        </tr>
        `;

    });

}

async function salvarReserva(){

    const cliente = document.getElementById("cliente").value;
    const brinquedo = document.getElementById("brinquedo").value;
    const data_evento = document.getElementById("data_evento").value;
    const valor = document.getElementById("valor").value;
    const status = document.getElementById("status").value;

    if(cliente === ""){
        alert("Digite o nome do cliente.");
        return;
    }

    const { error } = await supabaseClient
        .from("reservas")
        .insert([
            {
                cliente,
                brinquedo,
                data_evento,
                valor,
                status
            }
        ]);

    if(error){
        console.log(error);
        alert("Erro ao salvar reserva.");
        return;
    }

    alert("Reserva cadastrada com sucesso!");

    document.getElementById("cliente").value = "";
    document.getElementById("brinquedo").value = "";
    document.getElementById("data_evento").value = "";
    document.getElementById("valor").value = "";

    carregarReservas();

}

function abrirContrato(cliente, brinquedo, data, valor){

    localStorage.setItem("clienteContrato", cliente);
    localStorage.setItem("brinquedoContrato", brinquedo);
    localStorage.setItem("dataContrato", data);
    localStorage.setItem("valorContrato", valor);

    window.location.href = "contrato.html";

}

carregarReservas();

</script>

</body>
</html>
